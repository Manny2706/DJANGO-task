<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Delete Post - Mini Blog</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
		<div class="container">
			<a class="navbar-brand" href="/">Mini Blog</a>
		</div>
	</nav>

	<main class="container" style="max-width: 800px;">
		<h1 class="mb-4">Delete Post</h1>
		<div class="alert alert-warning">
			Are you sure you want to delete "<strong>{{ post.title }}</strong>"?
		</div>
		<form method="post">
			{% csrf_token %}
			<div class="d-flex gap-2">
				<button type="submit" class="btn btn-danger">Yes, delete</button>
				<a href="/post/{{ post.pk }}/" class="btn btn-secondary">Cancel</a>
			</div>
		</form>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
