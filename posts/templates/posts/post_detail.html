<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{ post.title }} - Mini Blog</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
		<div class="container">
			<a class="navbar-brand" href="/">Mini Blog</a>
			<div class="d-flex gap-2">
				<a href="/post/{{ post.pk }}/edit/" class="btn btn-warning">Edit</a>
			<a href="/post/{{ post.pk }}/delete/" class="btn btn-danger">Delete</a>
				<a href="/post/new/" class="btn btn-primary">Create Post</a>
			</div>
		</div>
	</nav>

	<main class="container">
		<h1 class="mb-3">{{ post.title }}</h1>
		<p class="text-muted">Created: {{ post.created_at|date:"M d, Y H:i" }} | Updated: {{ post.updated_at|date:"M d, Y H:i" }}</p>
	<hr>
	<div class="mt-3" style="white-space: pre-wrap;">{{ post.content }}</div>
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
