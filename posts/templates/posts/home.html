<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Mini Blog</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
		<div class="container">
			<a class="navbar-brand" href="/">Mini Blog</a>
			<div>
				<a href="/post/new/" class="btn btn-primary">Create Post</a>
			</div>
		</div>
	</nav>

	<main class="container">
		<h1 class="mb-4">All Posts</h1>
		{% if posts %}
			<div class="list-group">
				{% for post in posts %}
					<a href="/post/{{ post.pk  }}/" class="list-group-item  list-group-item-action">
					<div class="d-flex w-100 justify-content-between">
						<h5 class="mb-1">{{ post.title }}</h5>
			<small class="text-muted">{{ post.created_at|date:"M d, Y H:i" }}</small>
						</div>
					<p class="mb-1 text-truncate">{{ post.content }}</p>
					</a>
				{% endfor %}
			</div>
		{% else %}
			<div class="alert alert-info">No posts yet. Create the first one!</div>
		{% endif %}
	</main>

	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
